name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Octo STS to federate

    steps:
      - uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: RyanMeline/semver-practice
          identity: release

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          fetch-depth: 0   # semantic-release needs full history, not a shallow clone
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: npx semantic-release
