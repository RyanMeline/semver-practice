name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Octo STS to federate

    steps:
      - uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: RyanMeline/semver-practice
          identity: release

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          release-type: simple
